{% extends "base.html" %}

{% block title %}Admin Profile Update{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">
                        <i class="fas fa-user-cog"></i> Admin Profile Update
                    </h4>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('admin_profile_update') }}" class="validate-form">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="username" class="form-label">Username</label>
                                    <input type="text" class="form-control" id="username" name="username" 
                                           value="{{ admin[0] if admin else '' }}" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="email" name="email" 
                                           value="{{ admin[1] if admin else '' }}" required>
                                </div>
                            </div>
                        </div>
                        
                        <hr class="my-4">
                        <h6 class="mb-3">Change Password (Optional)</h6>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="current_password" class="form-label">Current Password</label>
                                    <input type="password" class="form-control" id="current_password" name="current_password">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="new_password" class="form-label">New Password</label>
                                    <input type="password" class="form-control" id="new_password" name="new_password">
                                </div>
                            </div>
                        </div>
                        
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary me-md-2">
                                <i class="fas fa-arrow-left"></i> Back to Dashboard
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Update Profile
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Form validation
document.addEventListener('DOMContentLoaded', function() {
    const form = document.querySelector('.validate-form');
    const currentPassword = document.getElementById('current_password');
    const newPassword = document.getElementById('new_password');
    
    form.addEventListener('submit', function(e) {
        // If one password field is filled, both must be filled
        if (currentPassword.value && !newPassword.value) {
            e.preventDefault();
            alert('Please enter new password');
            newPassword.focus();
        }
        
        if (newPassword.value && !currentPassword.value) {
            e.preventDefault();
            alert('Please enter current password');
            currentPassword.focus();
        }
        
        if (newPassword.value && newPassword.value.length < 6) {
            e.preventDefault();
            alert('New password must be at least 6 characters long');
            newPassword.focus();
        }
    });
});
</script>
{% endblock %}
